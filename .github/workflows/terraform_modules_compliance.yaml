name: Terraform Module Compliance (CC008)

on:
  workflow_call:
    inputs:
      terraform-directories:
        type: string
        description: List of working directories in JSON format, e.g. '["terraform", "terraform-product"]'.
        default: '["terraform"]'

permissions:
  contents: read

jobs:
  compliance:
    name: CC008 Compliance Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        working_dir: ${{ fromJSON(inputs.terraform-directories) }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check required file structure (CC008)
        working-directory: ${{ matrix.working_dir }}
        run: |
          set -euo pipefail
          failed=0
          for f in README.md providers.tf terraform.tf variables.tf outputs.tf; do
            if [ ! -f "${f}" ]; then
              echo "ERROR: Required file '${f}' is missing (CC008 §Module structure)"
              failed=1
            fi
          done
          # main.tf may be split into type-specific files
          if ! ls main.tf applications.tf integrations.tf offers.tf 2>/dev/null | grep -q .; then
            echo "ERROR: At least one of main.tf, applications.tf, integrations.tf, or offers.tf must exist (CC008 §Module structure)"
            failed=1
          fi
          exit "${failed}"

      - name: Check model_uuid variable (CC008)
        working-directory: ${{ matrix.working_dir }}
        run: |
          set -euo pipefail
          if ! grep -qE 'variable[[:space:]]+"model_uuid"' variables.tf; then
            echo "ERROR: 'model_uuid' variable not found in variables.tf (CC008 §Inputs)"
            exit 1
          fi

      - name: Check no deprecated endpoints output (CC008)
        working-directory: ${{ matrix.working_dir }}
        run: |
          set -euo pipefail
          if grep -qE 'output[[:space:]]+"endpoints"' outputs.tf; then
            echo "ERROR: Deprecated 'endpoints' output found in outputs.tf — use 'provides' and 'requires' instead (CC008 §Outputs)"
            exit 1
          fi
